<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-labelledby="t d">
  <title id="t">Kit VibeCoding Pro</title>
  <desc id="d">Herramientas, prompts y flujo para programar con agentes de IA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070c"/>
      <stop offset=".55" stop-color="#0d0b1a"/>
      <stop offset="1" stop-color="#120a14"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1600" height="640" fill="url(#fade)"/></mask>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <style>
      .orb{animation:drift 14s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
      .orb.b{animation-duration:18s;animation-delay:-6s}
      .orb.c{animation-duration:22s;animation-delay:-11s}
      @keyframes drift{from{transform:translate(-30px,-10px) scale(1)}to{transform:translate(40px,20px) scale(1.12)}}
      .rise{}
      .caret{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.orb,.rise,.caret{animation:none;opacity:1}}
      text{font-family:ui-sans-serif,-apple-system,"SF Pro Display","Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    </style>
  </defs>

  <rect width="1600" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="640" rx="28" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle class="orb" cx="300" cy="120" r="380" fill="url(#glowA)"/>
  <circle class="orb b" cx="1300" cy="520" r="420" fill="url(#glowB)"/>
  <circle class="orb c" cx="1180" cy="80" r="300" fill="url(#glowC)"/>
  <rect x=".5" y=".5" width="1599" height="639" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- badge -->
  <g class="rise r1" transform="translate(800 150)">
    <rect x="-175" y="-20" width="350" height="40" rx="20" fill="url(#chip)" stroke="#ffffff" stroke-opacity=".14"/>
    <circle cx="-148" cy="0" r="5" fill="#34d399"/>
    <text x="12" y="6" text-anchor="middle" fill="#e5e7eb" font-size="16" font-weight="500" letter-spacing="1.5">CLAUDE CODE · EDICIÓN PRO</text>
  </g>

  <!-- title -->
  <g class="rise r2">
    <text x="800" y="290" text-anchor="middle" font-size="104" font-weight="800" letter-spacing="-3" fill="#ffffff">Kit <tspan fill="url(#brand)">VibeCoding</tspan> Pro</text>
  </g>

  <g class="rise r3">
    <text x="800" y="352" text-anchor="middle" font-size="27" fill="#a1a1aa" letter-spacing=".2">Las herramientas, los prompts y el método para programar con agentes de IA.</text>
  </g>

  <!-- terminal line -->
  <g class="rise r4" transform="translate(800 440)">
    <rect x="-330" y="-34" width="660" height="68" rx="16" fill="#0b0b12" fill-opacity=".85" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="-300" cy="0" r="6" fill="#ff5f57"/>
    <circle cx="-280" cy="0" r="6" fill="#febc2e"/>
    <circle cx="-260" cy="0" r="6" fill="#28c840"/>
    <text class="mono" x="-228" y="7" font-size="21" fill="#e4e4e7"><tspan fill="#f472b6">❯</tspan> idea <tspan fill="#71717a">→</tspan> prompt <tspan fill="#71717a">→</tspan> <tspan fill="#fbbf24">proyecto listo</tspan></text>
    <rect class="caret" x="262" y="-12" width="11" height="24" rx="2" fill="#a78bfa"/>
  </g>

  <!-- footer chips -->
  <g class="rise r4" font-size="15" fill="#d4d4d8" text-anchor="middle">
    <g transform="translate(560 560)"><rect x="-80" y="-18" width="160" height="36" rx="18" fill="url(#chip)" stroke="#fff" stroke-opacity=".1"/><text y="5">8 herramientas</text></g>
    <g transform="translate(800 560)"><rect x="-80" y="-18" width="160" height="36" rx="18" fill="url(#chip)" stroke="#fff" stroke-opacity=".1"/><text y="5">3 prompts</text></g>
    <g transform="translate(1040 560)"><rect x="-80" y="-18" width="160" height="36" rx="18" fill="url(#chip)" stroke="#fff" stroke-opacity=".1"/><text y="5">1 método</text></g>
  </g>
</svg>
