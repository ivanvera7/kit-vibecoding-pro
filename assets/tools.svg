<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" width="1600" height="660" role="img" aria-labelledby="t d">
  <title id="t">Herramientas del kit</title>
  <desc id="d">Superpowers, Ponytail, Caveman, Context7, RTK, Graphify, fnm y utilidades de terminal.</desc>
  <defs>
    <radialGradient id="spot" cx=".72" cy=".44" r=".55">
      <stop offset="0" stop-color="#969fb9" stop-opacity=".09"/><stop offset="1" stop-color="#969fb9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb3d9"/><stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter Tight",Inter,"Segoe UI","Helvetica Neue",Arial,sans-serif;letter-spacing:-.012em}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
      .live{opacity:0;animation:lv 16s infinite}
      @keyframes lv{0%,1%{opacity:0}3%,11%{opacity:1}13.5%,100%{opacity:0}}
      .d0{animation-delay:0s}
      .d1{animation-delay:2s}
      .d2{animation-delay:4s}
      .d3{animation-delay:6s}
      .d4{animation-delay:8s}
      .d5{animation-delay:10s}
      .d6{animation-delay:12s}
      .d7{animation-delay:14s}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1600" height="660" rx="28" fill="#000"/>
  <rect width="1600" height="660" rx="28" fill="url(#spot)"/>
  <rect x=".5" y=".5" width="1599" height="659" rx="28" fill="none" stroke="#fff" stroke-opacity="0.1"/>

  <text x="96" y="92" font-size="22" font-weight="600" fill="url(#eb)">Caja de herramientas</text>
  <text x="94" y="146" font-size="48" font-weight="700" letter-spacing="-.035em" fill="#f5f5f7">Ocho piezas. Un solo flujo.</text>
