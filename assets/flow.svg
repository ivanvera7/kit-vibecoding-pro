<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-labelledby="t d">
  <title id="t">Cómo funciona</title>
  <desc id="d">Seis pasos: entender, diseñar, planificar, implementar, verificar y revisar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080e"/><stop offset="1" stop-color="#110c1a"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="190" y1="0" x2="1410" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".3"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <style>
      text{font-family:ui-sans-serif,-apple-system,"SF Pro Display","Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
      .dash{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-32}}
      .pulse{animation:pulse 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .s2{animation-delay:1s}.s3{animation-delay:2s}.s4{animation-delay:3s}.s5{animation-delay:4s}.s6{animation-delay:5s}
      @keyframes pulse{0%,14%{opacity:.45;transform:scale(1.3)}24%,100%{opacity:.18;transform:scale(1)}}
      @media (prefers-reduced-motion:reduce){.dash,.pulse{animation:none}.pulse{opacity:.6}}
    </style>
  </defs>
  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <ellipse cx="800" cy="230" rx="700" ry="160" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1599" height="419" rx="28" fill="none" stroke="#fff" stroke-opacity=".08"/>

  <text x="80" y="78" fill="#71717a" font-size="15" letter-spacing="3" class="mono">EL MÉTODO</text>
  <text x="80" y="118" fill="#fafafa" font-size="34" font-weight="700" letter-spacing="-.5">De la idea al código verificado</text>

  <path d="M190 250H1410" stroke="url(#line)" stroke-width="2" stroke-opacity=".35"/>
  <path class="dash" d="M190 250H1410" stroke="url(#line)" stroke-width="2"/>

  <g font-size="21" font-weight="600" fill="#fafafa" text-anchor="middle">
    <g transform="translate(190 250)">
      <circle class="pulse" r="30" fill="#a78bfa" opacity=".25"/>
      <circle r="9" fill="#a78bfa"/>
      <text y="-48" class="mono" font-size="14" fill="#a78bfa" font-weight="500">01</text>
      <text y="68">Entender</text><text y="94" font-size="14" font-weight="400" fill="#a1a1aa">qué y para quién</text>
    </g>
    <g transform="translate(434 250)">
      <circle class="pulse s2" r="30" fill="#c084fc" opacity=".25"/>
      <circle r="9" fill="#c084fc"/>
      <text y="-48" class="mono" font-size="14" fill="#c084fc" font-weight="500">02</text>
      <text y="68">Diseñar</text><text y="94" font-size="14" font-weight="400" fill="#a1a1aa">opciones y decisión</text>
    </g>
    <g transform="translate(678 250)">
      <circle class="pulse s3" r="30" fill="#e879f9" opacity=".25"/>
      <circle r="9" fill="#e879f9"/>
      <text y="-48" class="mono" font-size="14" fill="#e879f9" font-weight="500">03</text>
      <text y="68">Planificar</text><text y="94" font-size="14" font-weight="400" fill="#a1a1aa">pasos verificables</text>
    </g>
    <g transform="translate(922 250)">
      <circle class="pulse s4" r="30" fill="#f472b6" opacity=".25"/>
      <circle r="9" fill="#f472b6"/>
      <text y="-48" class="mono" font-size="14" fill="#f472b6" font-weight="500">04</text>
      <text y="68">Implementar</text><text y="94" font-size="14" font-weight="400" fill="#a1a1aa">el cambio mínimo</text>
    </g>
    <g transform="translate(1166 250)">
      <circle class="pulse s5" r="30" fill="#fb923c" opacity=".25"/>
      <circle r="9" fill="#fb923c"/>
      <text y="-48" class="mono" font-size="14" fill="#fb923c" font-weight="500">05</text>
      <text y="68">Verificar</text><text y="94" font-size="14" font-weight="400" fill="#a1a1aa">tests y evidencia</text>
    </g>
    <g transform="translate(1410 250)">
      <circle class="pulse s6" r="30" fill="#fbbf24" opacity=".25"/>
      <circle r="9" fill="#fbbf24"/>
      <text y="-48" class="mono" font-size="14" fill="#fbbf24" font-weight="500">06</text>
      <text y="68">Revisar</text><text y="94" font-size="14" font-weight="400" fill="#a1a1aa">antes de integrar</text>
    </g>
  </g>
</svg>
